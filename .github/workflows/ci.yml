name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  identity:
    # 只检查 push（PR 会带来 fork 作者的邮箱，不该拦）。
    # 目的：防止把 GitHub 提交邮箱写错、导致提交被算到另一个账号头上。
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify commit author emails
        run: |
          bad="$(git log --no-merges --format='%ae' | sort -u | grep -vE '^(eastmg@users\.noreply\.github\.com|noreply@github\.com)$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::Unexpected commit author email(s):"
            echo "$bad"
            echo "See AGENTS.md §6 for the identity checklist."
            exit 1
          fi
          echo "commit identity OK"

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Test shell-agnostic engine layer
        run: npm test
      - name: Syntax check JS entries
        run: npm run check

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build src/GachaCalendar/GachaCalendar.csproj -c Release
      - name: Verify snapshot contract fields
        shell: pwsh
        run: |
          $snap = Get-Content data/sample-snapshot.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($snap.schemaVersion -ne 1) { throw "snapshot schemaVersion != 1" }
          if (-not $snap.games -or $snap.games.Count -lt 20) { throw "snapshot games missing" }
          if (-not $snap.result.games) { throw "result.games missing" }
          $g = $snap.result.games.PSObject.Properties | Select-Object -First 1
          foreach ($f in @("banner","roles","bannerDates","event","eventDates","gachaFail","eventFail","okAt")) {
            if (-not $g.Value.PSObject.Properties.Name.Contains($f)) { throw "record missing field $f" }
          }
          Write-Host "snapshot contract OK: $($snap.games.Count) games"

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check refresh tool
        working-directory: tools
        run: |
          npm ci --no-audit --no-fund
          node --check refresh.mjs
